<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Velora</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--ease:cubic-bezier(.22,.9,.3,1);--spring:cubic-bezier(.3,1.35,.45,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Arial,sans-serif;--serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
--bg:#09090b;--text:#f4f4f6;--dim:#b2b2bb;--faint:#767680;--line:rgba(255,255,255,.14);--g1:#fff;--g2:#c4c8d2;--g3:#fff;--btn:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}textarea{font:inherit;color:inherit}svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;z-index:2}.col{width:100%;max-width:740px;margin:0 auto}
/* жидкое стекло */
.gl,.me .bubble,.sugg button{position:relative;isolation:isolate;background:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 55%,rgba(255,255,255,.11));border:1px solid var(--line);
-webkit-backdrop-filter:blur(26px) saturate(1.9) brightness(1.12);backdrop-filter:blur(26px) saturate(1.9) brightness(1.12);
box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 24px rgba(255,255,255,.05),var(--drop,0 16px 44px -14px rgba(0,0,0,.75))}
.gl::before,.me .bubble::before,.sugg button::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:.5;transition:opacity .5s;
background:radial-gradient(130px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.3),transparent 70%)}
.gl:active::before{opacity:1}
.rb{width:var(--btn);height:var(--btn);flex:none;border-radius:50%;display:grid;place-items:center;transition:transform .6s var(--spring),opacity .4s}
.rb:active{transform:scale(.84)}.rb.sm{width:30px;height:30px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:999px;font-weight:500;font-size:15.5px;color:#0b0b0d;
background:linear-gradient(160deg,#fff,#cdd0d8);box-shadow:inset 0 1px 0 #fff,0 10px 30px -8px rgba(255,255,255,.4);transition:transform .55s var(--spring)}.cta:active{transform:scale(.95)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes itemIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
/* северное сияние, серебро */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora i:nth-child(1){width:80vmax;height:60vmax;left:-35vmax;top:-30vmax;background:#9aa1b4;opacity:.3;animation:af1 38s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:60vmax;height:55vmax;right:-30vmax;top:10vh;background:#fff;opacity:.1;animation:af2 46s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:64vmax;height:50vmax;left:-12vmax;bottom:-36vmax;background:#757c90;opacity:.28;animation:af3 54s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:36vmax;height:36vmax;right:-6vmax;bottom:8vh;background:#dfe2ea;opacity:.09;animation:af1 32s ease-in-out infinite alternate-reverse}
@keyframes af1{to{transform:translate(24vmax,14vmax) scale(1.2) rotate(18deg)}}@keyframes af2{to{transform:translate(-22vmax,-16vmax) scale(1.18) rotate(-22deg)}}@keyframes af3{to{transform:translate(26vmax,-12vmax) scale(1.1) rotate(26deg)}}
.stars{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 88% 62%,#fff,transparent),radial-gradient(1px 1px at 22% 88%,#fff,transparent);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.12}}
/* шапка */
header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--sat) + 8px) 12px 8px;animation:dropIn 1s var(--ease) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-24px) scale(.95);filter:blur(8px)}}
#title{height:var(--btn);padding:0 20px;border-radius:999px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:450;max-width:56%;white-space:nowrap;overflow:hidden;transition:opacity .35s,transform .5s var(--ease)}
#title span{overflow:hidden;text-overflow:ellipsis}#title.swap{opacity:0;transform:translateY(8px) scale(.96)}#title .mark{width:18px;height:18px;margin:0;animation:none}
/* лента */
#feed{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 18px 230px;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(transparent 0,#000 28px);mask-image:linear-gradient(transparent 0,#000 28px)}#feed::-webkit-scrollbar{display:none}
.msg{margin:0 0 24px;animation:rise .9s var(--ease) both}.msg.still{animation:none}.msg.me{display:flex;justify-content:flex-end}
.me .bubble{max-width:82%;padding:12px 18px;border-radius:26px;border-bottom-right-radius:10px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;transform-origin:right bottom;animation:pop .7s var(--spring) both}
@keyframes pop{from{transform:scale(.75) translateY(10px);opacity:0}}
.ph{display:block;max-width:100%;max-height:220px;border-radius:18px;margin:0 0 8px}
.ai .txt{font-size:17px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.w{display:inline;animation:wordIn .8s var(--ease) both}@keyframes wordIn{from{opacity:0;filter:blur(9px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.mark{display:block;width:24px;height:24px;margin-top:12px;animation:spinIn 1.1s var(--ease) both}
.mark.think{animation:think 1.7s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
.mark use{fill:url(#mgrad)}#mgrad stop:nth-child(1){stop-color:var(--g1)}#mgrad stop:nth-child(2){stop-color:var(--g2)}#mgrad stop:nth-child(3){stop-color:var(--g3)}
.hello{display:grid;justify-items:center;text-align:center;margin-top:min(18vh,130px);gap:14px}
.hello .big{width:64px;height:64px;margin:0;animation:bloom 1.7s var(--ease) both,float 6s 1.7s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(255,255,255,.55))}

.hello h2{margin:0;font-weight:400;font-size:38px;letter-spacing:-.5px;font-family:var(--serif);background:linear-gradient(90deg,#8b8e9a,#fff,#8b8e9a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rise 1s .15s var(--ease) both,shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.hello p{margin:0;color:var(--dim);font-size:16.5px;animation:rise 1s .3s var(--ease) both}
.sugg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;max-width:480px}
.sugg button{height:44px;padding:0 18px;border-radius:999px;font-size:14.5px;color:var(--dim);animation:rise .9s var(--ease) both;transition:transform .55s var(--spring),color .3s}
.sugg button:nth-child(1){animation-delay:.45s}.sugg button:nth-child(2){animation-delay:.55s}.sugg button:nth-child(3){animation-delay:.65s}.sugg button:nth-child(4){animation-delay:.75s}.sugg button:active{transform:scale(.92);color:var(--text)}
/* медиа */
.shot{max-width:min(100%,440px)}.frame{border-radius:30px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px -20px #000;display:grid;min-height:140px;position:relative}
.frame img,.frame video{width:100%;display:block;max-height:62vh;object-fit:contain;animation:develop 1.9s var(--ease) both}
@keyframes develop{from{filter:blur(38px) saturate(.4);transform:scale(1.15);opacity:.1}60%{filter:blur(9px)}to{filter:none;transform:none;opacity:1}}
.tools{display:flex;gap:8px;margin-top:12px}
.pending{aspect-ratio:3/4;width:min(72vw,300px);position:relative;display:grid;place-items:center;overflow:hidden}
.pending::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#fff,transparent 35%,#8a8f9e,transparent 70%,#fff,transparent);opacity:.4;animation:sweep 3.6s linear infinite;filter:blur(34px)}
@keyframes sweep{to{transform:rotate(360deg)}}.pending span{position:relative;font-size:14px;color:var(--dim);animation:breath 2.2s ease-in-out infinite}@keyframes breath{50%{opacity:.4}}
/* ввод */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:34px 12px calc(var(--sab) + 12px);background:linear-gradient(transparent,var(--bg) 45%);pointer-events:none;animation:fadeUp 1.1s .1s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(50px) scale(.97);filter:blur(8px)}}
.composer{pointer-events:auto;border-radius:34px;padding:14px 12px 12px 20px;transition:border-color .5s,box-shadow .6s}
.composer:focus-within{border-color:rgba(255,255,255,.4);--drop:0 0 0 5px rgba(255,255,255,.06),0 0 70px -12px rgba(255,255,255,.3)}
.composer::after{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .8s;background:conic-gradient(from var(--ang),transparent,rgba(255,255,255,.95),transparent 40%,rgba(255,255,255,.5),transparent 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite}
.composer:focus-within::after{opacity:.85}@keyframes rot{to{--ang:360deg}}
textarea{display:block;width:100%;min-height:26px;max-height:150px;border:0;outline:0;resize:none;background:transparent;font-size:16.5px;line-height:1.45;padding:2px 2px 8px 0;caret-color:#fff;transition:height .3s var(--ease)}textarea::placeholder{color:var(--faint)}
.att{position:relative;width:76px;height:76px;margin:0 0 12px;animation:chipIn .6s var(--spring) both}.att[hidden]{display:none}
.att img{width:100%;height:100%;object-fit:cover;border-radius:20px;border:1px solid var(--line)}.att .sm{position:absolute;top:-8px;right:-8px}
.bar{display:flex;align-items:center;gap:8px}.plus{color:var(--dim)}.plus.open{transform:rotate(135deg);color:var(--text)}.plus:active{transform:scale(.86)}.plus.open:active{transform:rotate(135deg) scale(.86)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;background:rgba(255,255,255,.12);border:1px solid var(--line);animation:chipIn .6s var(--spring) both}.chip[hidden]{display:none}
@keyframes chipIn{from{opacity:0;transform:translateX(-16px) scale(.6)}}
.send{margin-left:auto;background:linear-gradient(160deg,#fff,#cdd0d8);color:#0b0b0d;transform:scale(.8);opacity:.35;box-shadow:inset 0 1px 0 #fff,0 8px 24px -6px rgba(255,255,255,.35)}
.send.on{transform:none;opacity:1;animation:ring 2.8s ease-out infinite}.send.on:active{transform:scale(.84)}
@keyframes ring{0%{box-shadow:inset 0 1px 0 #fff,0 0 0 0 rgba(255,255,255,.35)}70%,100%{box-shadow:inset 0 1px 0 #fff,0 0 0 14px rgba(255,255,255,0)}}
.foot{pointer-events:auto;margin:10px 0 0;text-align:center;font-size:12px;color:var(--faint);transition:color .4s}.foot.low{color:var(--dim)}
.pop{position:absolute;left:10px;bottom:calc(100% + 12px);min-width:260px;padding:7px;border-radius:28px;transform-origin:left bottom;visibility:hidden;opacity:0;transform:scale(.6) translateY(16px);transition:opacity .25s,transform .6s var(--spring),visibility 0s .6s}
.pop.open{visibility:visible;opacity:1;transform:none;transition:opacity .25s,transform .6s var(--spring)}
.pop button{display:flex;align-items:center;gap:12px;width:100%;height:50px;padding:0 14px;border-radius:21px;font-size:15.5px;text-align:left;opacity:0;transform:translateY(10px);transition:background .25s,opacity .4s,transform .6s var(--spring)}
.pop.open button{opacity:1;transform:none}.pop.open button:nth-child(2){transition-delay:.05s}.pop.open button:nth-child(3){transition-delay:.1s}.pop.open button:nth-child(4){transition-delay:.15s}
.pop button:active{background:rgba(255,255,255,.1);transform:scale(.96)}.pop button small{margin-left:auto;color:var(--faint);font-size:13px}.pop button[hidden]{display:none}
/* меню */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .5s,backdrop-filter .6s,-webkit-backdrop-filter .6s,visibility 0s .6s}
.scrim.on{opacity:1;visibility:visible;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .5s,backdrop-filter .6s,-webkit-backdrop-filter .6s}
.drawer{position:fixed;z-index:21;top:10px;bottom:10px;left:10px;width:min(86vw,340px);border-radius:36px;transform:translateX(-112%) scale(.95);opacity:0;transition:transform .8s var(--ease),opacity .5s;padding:calc(var(--sat) + 16px) 12px calc(var(--sab) + 12px);display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none;opacity:1}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;font-family:var(--serif);font-size:27px;letter-spacing:-.3px}.brand .mark{margin:0;width:28px;height:28px;animation:none}.drawer.on .brand .mark{animation:spinIn 1.2s .15s var(--ease) both}
.newc{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:999px;font-size:15.5px;transition:transform .5s var(--spring)}.newc:active{transform:scale(.95)}
.lbl{margin:16px 12px 8px;font-size:12px;color:var(--faint)}.list{flex:1;overflow-y:auto;scrollbar-width:none;min-height:60px}
.item{display:flex;align-items:center;gap:6px;border-radius:18px;opacity:0;transition:background .25s}.drawer.on .item{animation:itemIn .65s var(--ease) both}
.item .nm{flex:1;padding:12px;font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}.item.cur{background:rgba(255,255,255,.1)}.item.cur .nm{color:var(--text)}
.item .x{width:36px;height:36px;display:grid;place-items:center;color:var(--faint);border-radius:50%;transition:transform .45s var(--spring),color .3s}.item .x:active{transform:scale(.78);color:#e8e8ec}
.plan{margin:8px 0 0;padding:16px;border-radius:28px}.plan b{font-weight:500;font-size:15.5px}.plan p{margin:2px 0 12px;color:var(--dim);font-size:13.5px}
.bar2{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}.bar2 i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8d92a3,#fff);transition:width 1.2s var(--ease)}
/* оплата */
.sheet{position:fixed;z-index:30;left:10px;right:10px;bottom:calc(var(--sab) + 10px);max-width:520px;margin:0 auto;padding:12px 22px 22px;border-radius:40px;text-align:center;transform:translateY(120%) scale(.94);opacity:0;visibility:hidden;transition:transform .85s var(--spring),opacity .4s,visibility 0s .85s}
.sheet.on{transform:none;opacity:1;visibility:visible;transition:transform .85s var(--spring),opacity .4s}
.grab{display:block;width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 auto 14px}.sheet .sm{position:absolute;top:16px;right:16px}
.sheet .mark{margin:6px auto 12px;width:46px;height:46px;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.5))}
.sheet h3{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.4px}.sheet p{margin:6px 0 16px;color:var(--dim);font-size:15px}
.perks{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px;text-align:left}
.perks li{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:15px;opacity:0}
.sheet.on .perks li{animation:rise .8s var(--ease) both}.sheet.on .perks li:nth-child(2){animation-delay:.1s}.sheet.on .perks li:nth-child(3){animation-delay:.2s}.sheet.on .perks li:nth-child(1){animation-delay:.05s}
.perks svg{width:18px;height:18px;flex:none}.sheet small{display:block;margin-top:12px;color:var(--faint);font-size:12px}#pay.wait{opacity:.6;pointer-events:none}
.toast{position:fixed;z-index:40;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);padding:12px 20px;border-radius:999px;font-size:14px;white-space:nowrap;animation:toastIn .6s var(--spring) both}
.toast.out{transition:.45s;opacity:0;transform:translate(-50%,-14px) scale(.9)}@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px) scale(.8)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

:root{--bg:#09090b}.aurora{opacity:.5}
.gl,.me .bubble,.sugg button{background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.025) 55%,rgba(255,255,255,.06))}
@keyframes spinIn{from{opacity:0;transform:translateY(-22px) scale(.4)}60%{transform:translateY(2px) scale(1.06)}}
@keyframes bloom{from{opacity:0;transform:translateY(-44px) scale(.3);filter:blur(12px)}60%{transform:translateY(3px) scale(1.04)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes think{0%,100%{transform:translateY(0) scale(.85);opacity:.6}50%{transform:translateY(-4px) scale(1.12);opacity:1}}
.ask{max-width:340px;font-family:var(--serif);font-style:italic;font-size:21px!important;line-height:1.4;color:var(--text)!important;margin-top:4px!important}
@keyframes askSwap{0%{opacity:1;filter:none;transform:none}45%,55%{opacity:0;filter:blur(9px);transform:translateY(8px)}100%{opacity:1;filter:none;transform:none}}

:root{--bg:#09090b;--line:rgba(255,255,255,.085)}.aurora{opacity:.26}.stars{display:none}
.gl,.me .bubble,.sugg button{background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 60%,rgba(255,255,255,.04));-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--drop,0 14px 40px -16px #000)}
.gl::before,.me .bubble::before{opacity:.28}
.hello .big{filter:none;width:52px;height:52px}.mark.think,.sheet .mark{filter:none}
.hello h2{font-size:34px;background:none;-webkit-text-fill-color:currentColor;color:#ececf0;animation:rise 1s .15s var(--ease) both}
.ask{font-size:18px!important;color:var(--dim)!important}
.send,.cta{background:#ececf0;box-shadow:none}.send.on{animation:none}.composer:focus-within::after{opacity:.35}
.bar2 i{background:#e4e4e8}.pending::before{opacity:.2}.foot{color:#55555e}.foot.low{color:var(--dim)}

.ripples{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.rip{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;opacity:0;background:radial-gradient(circle,transparent 60%,rgba(255,255,255,.3) 63%,transparent 68%);animation:rip 3s var(--ease) both}
@keyframes rip{from{transform:scale(.15);opacity:.9}to{transform:scale(8);opacity:0}}

:root{--bg:#09090b;--line:rgba(150,185,255,.13);--g2:#b9cdf3}.aurora{opacity:.6}
.aurora i:nth-child(1){background:#4a6fd8}.aurora i:nth-child(2){background:#9bb8ff}.aurora i:nth-child(3){background:#2f4fa8}.aurora i:nth-child(4){background:#7fa2f0}

.send,.cta{background:#e8eefb}.bar2 i{background:linear-gradient(90deg,#6f93e8,#e8eefb)}.foot{color:#5f6a88}.hello h2{color:#eaf0fc}

.pop{max-height:min(64vh,470px);overflow-y:auto;scrollbar-width:none}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0}.quick[hidden]{display:none}
.quick button{flex:none;height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;color:var(--dim);background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .5s var(--spring)}.quick button:active{transform:scale(.93)}
.mtools{display:flex;gap:8px;margin-top:10px;animation:rise .8s .5s var(--ease) both}.still .mtools{animation:none}
.cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}.cam[hidden]{display:none}.cam.on{opacity:1}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.camBar{display:flex;align-items:center;justify-content:space-around;padding:20px 20px calc(var(--sab) + 26px);background:#000}

.camX{position:absolute;top:calc(var(--sat) + 12px);left:12px;z-index:2}

.prof{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:24px;margin:0 0 10px;text-align:left}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:500;font-size:19px;background:linear-gradient(160deg,#fff,#aeb6cc);color:#0b0b0d;overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}
.prof b{display:block;font-size:15.5px;font-weight:500}.prof small{color:var(--faint);font-size:12.5px}
.set{position:fixed;z-index:30;left:10px;right:10px;top:calc(var(--sat) + 10px);bottom:calc(var(--sab) + 10px);max-width:520px;margin:0 auto;border-radius:36px;display:flex;flex-direction:column;transform:translateY(110%) scale(.95);opacity:0;visibility:hidden;transition:transform .85s var(--spring),opacity .4s,visibility 0s .85s}
.set.on{transform:none;opacity:1;visibility:visible;transition:transform .85s var(--spring),opacity .4s}
.set .sc{flex:1;overflow-y:auto;padding:4px 18px 26px;scrollbar-width:none}
.set .top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px 22px}.set h3{margin:0;font-family:var(--serif);font-weight:400;font-size:27px}
.set h4{margin:22px 4px 8px;font-size:12px;font-weight:400;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;font-size:15px}

.seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:rgba(255,255,255,.07)}.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;color:var(--dim);transition:background .3s,color .3s}.seg button.on{background:#ececf0;color:#0b0b0d}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .3s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .45s var(--spring)}.sw.on{background:#6f93e8}.sw.on::after{transform:translateX(20px)}
.set select,.set .f{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;padding:10px 12px;outline:0}
.set select{max-width:55%}.set select option{color:#000}.set .f{width:100%;display:block;margin-bottom:8px}.set textarea.f{min-height:84px;resize:none;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.stats div{padding:12px 6px;text-align:center;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.stats b{display:block;font-size:20px;font-weight:500}.stats small{color:var(--faint);font-size:12px}
.btnr{width:100%;height:46px;border-radius:16px;margin-bottom:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:15px}.btnr.danger{color:#ff8f8f}
.note{margin:10px 4px 0;color:var(--faint);font-size:12px;line-height:1.4;text-align:center}
.calm *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.calm .aurora,.calm .ripples{display:none}
.ai .txt{font-size:calc(17px*var(--fs,1))}.me .bubble{font-size:calc(16px*var(--fs,1))}
.beta{flex:none;font-style:normal;font-size:10.5px;font-weight:500;letter-spacing:.7px;text-transform:uppercase;padding:3px 8px;border-radius:99px;color:#0b0b0d;background:linear-gradient(160deg,#fff,#aeb6cc);font-family:var(--sans);line-height:1.2}
#title .beta{margin-left:-2px}.brand .beta{align-self:center;margin-top:2px}

/* v2: без свечения, тоньше, больше движения */
html,body{font-weight:400}b,strong{font-weight:500}
.gl::before,.me .bubble::before,.sugg button::before,.composer::after{display:none!important}
.composer:focus-within{border-color:rgba(255,255,255,.24);--drop:0 16px 44px -14px rgba(0,0,0,.75)}
.send,.send.on{box-shadow:none;animation:none}.mark.think{filter:none}
.rb,.chip,.btnr,.newc,.prof,.row,.stats div{transition:transform .35s var(--spring),background .3s,opacity .3s}
#setc>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.list>*{animation:itemIn .5s var(--ease) both}.list>*:nth-child(2){animation-delay:.05s}.list>*:nth-child(3){animation-delay:.1s}.list>*:nth-child(4){animation-delay:.15s}.list>*:nth-child(n+5){animation-delay:.2s}
.msg.ai .acts,.msg.ai .shot{animation:rise .7s .15s var(--ease) both}
.sw::after{transition:transform .5s var(--spring),width .25s}.sw:active::after{width:30px}
.seg button{transition:background .35s,color .3s,transform .35s var(--spring)}.seg button:active{transform:scale(.94)}
.vm{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,8,18,.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.vm.on{opacity:1;visibility:visible;transition:opacity .5s}.vmx{position:absolute;top:calc(var(--sat) + 16px);right:16px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.vm p{margin:0;font-size:19px;font-family:var(--serif)}.vm small{color:var(--faint);font-size:12.5px}
.orb{position:relative;width:150px;height:150px;border-radius:50%;cursor:pointer;transition:transform .6s var(--spring)}.orb:active{transform:scale(.92)}
.orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.04) 70%);animation:orbA 3.2s ease-in-out infinite}
.orb i:nth-child(2){animation-delay:-1.1s;opacity:.5}.orb i:nth-child(3){animation-delay:-2.2s;opacity:.3}
@keyframes orbA{0%,100%{transform:scale(.82)}50%{transform:scale(1.12)}}
.orb.listen i{animation-duration:1.6s}.orb.think i{animation-duration:.9s;border-style:dashed}.orb.speak i{animation-duration:.7s}
.calm *{animation-duration:.01s!important}

/* v3: палитра «чернила и сирень», жидкое стекло, касания */
:root{--bg:#09090b;--text:#f6f5fb;--dim:#b7b5cc;--faint:#7f7d97;--line:rgba(255,255,255,.1);--g1:#fff;--g2:#d2ccff;--g3:#a8e4ff;--acc:linear-gradient(135deg,#8b7dff,#4cc3ff)}
.aurora{opacity:.7}.aurora i:nth-child(1){background:#5b4bff;opacity:.34}.aurora i:nth-child(2){background:#ff6aa8;opacity:.15}.aurora i:nth-child(3){background:#1fa8ff;opacity:.28}.aurora i:nth-child(4){background:#a06bff;opacity:.16}
.gl,.me .bubble,.sugg button,.row,.stats div,.btnr,input.f,textarea.f,.seg,.list>*,.newc,.prof,.pop button{
 --hl:rgba(255,255,255,.55);border:0!important;
 background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 48%,rgba(255,255,255,.09))!important;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 1.5px 2px 1px -1px var(--hl),inset -1.5px -2px 1px -1px rgba(255,255,255,.28),inset 0 0 22px rgba(255,255,255,.05),var(--drop,0 12px 32px -12px rgba(0,0,0,.65))!important}
.gl,.me .bubble,.sugg button{-webkit-backdrop-filter:blur(22px) saturate(2.1) brightness(1.1)!important;backdrop-filter:blur(22px) saturate(2.1) brightness(1.1)!important}
.gl::before,.me .bubble::before,.sugg button::before{display:block!important;content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:1;transition:opacity .4s;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%)!important}
.composer::after{display:none!important}
.me .bubble{background:linear-gradient(135deg,rgba(139,125,255,.5),rgba(76,195,255,.2) 70%,rgba(139,125,255,.28))!important}
.send,.cta{background:var(--acc)!important;color:#fff!important}.send .ic{stroke:#fff}.bar2 i{background:var(--acc)}
.beta{background:var(--acc)!important;color:#fff!important}.ava{background:var(--acc)!important;color:#fff!important}
.sw.on{background:linear-gradient(135deg,#8b7dff,#4cc3ff)!important}.seg button.on{background:rgba(255,255,255,.94)!important;color:#14112a!important;box-shadow:0 4px 14px -4px rgba(0,0,0,.5)!important}
textarea{caret-color:#8b7dff}.hello h2{color:var(--text)}.foot{color:var(--faint)}
.mc{position:relative;flex:none}.mc canvas{display:block;width:100%;height:100%}
.mcT{width:30px;height:38px;margin:-6px 0 -6px -6px}.mcM{width:34px;height:43px;margin-top:10px;animation:rise .8s var(--ease) both}
.mcD{width:72px;height:90px;margin-top:8px}.mcB{width:150px;height:188px;cursor:pointer;animation:bloom 1.2s var(--ease) both}.mcH{width:190px;height:238px}
.hello{margin-top:min(9vh,70px)}.pending{align-content:center;gap:4px}
.orb{width:170px;height:170px;margin-bottom:30px}.orb .mc{position:absolute;left:50%;bottom:-24px;margin-left:-95px}
/* касания */
.gl:not(.drawer):not(.set):not(.sheet):not(.pop):not(.composer),.me .bubble,.sugg button,.row,.stats div,.btnr,.list>*,.newc,.prof,.chip,.seg button,button{transition:scale .55s cubic-bezier(.2,1.7,.4,1),translate .55s cubic-bezier(.2,1.7,.4,1),transform .5s cubic-bezier(.3,1.35,.45,1),background .3s,opacity .3s,box-shadow .4s;scale:var(--s,1);translate:var(--tx,0) var(--ty,0)}
.touch{--s:1.07;transition-duration:.22s,.12s,.3s,.2s,.2s,.2s;transition-timing-function:cubic-bezier(.2,.8,.2,1)}
.rb.touch,.plus.touch,.send.touch{--s:1.16}.row.touch,.stats div.touch,.list>*.touch,.prof.touch,.btnr.touch{--s:.972}.sw.touch{--s:1.05}.seg button.touch{--s:1.08}
.gl.touch::before,.sugg button.touch::before,.chip.touch{background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.04) 60%)!important}
.row.touch,.btnr.touch,.list>*.touch,.prof.touch{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.1))!important}
.plus:active,.send.on:active,.sugg button:active{transform:none}.plus.open:active{transform:rotate(135deg)}.send.touch{filter:brightness(1.1)}
.mc>.mark{margin:0 auto;width:56%;height:auto}

/* v4: тёмная однотонная палитра, новые размеры, ожидание и пароль */
:root{--bg:#09090b;--text:#f4f4f6;--dim:#b3b3bb;--faint:#76767f;--line:rgba(255,255,255,.1);--g1:#fff;--g2:#e6e7ee;--g3:#b9bcc8;--acc:#ececf1}
.aurora{opacity:.6}.aurora i:nth-child(1){background:#8a8f9c;opacity:.22}.aurora i:nth-child(2){background:#fff;opacity:.06}.aurora i:nth-child(3){background:#5c606c;opacity:.24}.aurora i:nth-child(4){background:#b4b8c4;opacity:.07}
.me .bubble{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.09) 70%,rgba(255,255,255,.14))!important}
.send,.cta{background:#ececf1!important;color:#0b0b0e!important}.send .ic{stroke:#0b0b0e}.bar2 i{background:#ececf1}
.beta,.ava{background:#ececf1!important;color:#0b0b0e!important}
.sw.on{background:rgba(236,236,241,.92)!important}.sw.on::after{background:#0c0c10!important}
textarea{caret-color:#fff}
.mcT{width:36px;height:36px}.mcD{width:96px;height:96px}.mcH{width:220px;height:220px}
.mcB{width:190px;height:190px;margin-bottom:-4px;cursor:pointer;animation:bloom 1.2s var(--ease) both}
.orb .mc{margin-left:-110px;bottom:-30px}
.mcP{position:fixed;left:12px;bottom:150px;width:68px;height:68px;z-index:4;cursor:pointer;transition:opacity .5s,transform .8s var(--spring)}
.mcP.off{opacity:0;transform:translateY(34px) scale(.6);pointer-events:none}
.hello{margin-top:min(8vh,60px)}
.w{display:inline-block;animation:wordIn2 .95s var(--ease) both}
@keyframes wordIn2{0%{opacity:0;filter:blur(12px);transform:translateY(14px) scale(.92)}50%{opacity:1;filter:blur(1px) brightness(1.7)}100%{opacity:1;filter:none;transform:none}}
.msg.ai:not(.still){animation:rise .7s var(--ease) both}
.skel{display:grid;gap:10px;width:min(76%,290px);padding:8px 0}
.skel i{display:block;height:11px;border-radius:8px;background:linear-gradient(100deg,rgba(255,255,255,.07) 30%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.07) 70%);background-size:250% 100%;animation:shim 1.5s linear infinite}
.skel i:nth-child(2){width:86%;animation-delay:.15s}.skel i:nth-child(3){width:58%;animation-delay:.3s}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
.lock{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg)}
.lock[hidden]{display:none}.lock h3{margin:0;font:400 27px var(--serif)}
.lock .pw{display:flex;align-items:center;gap:8px;width:min(320px,100%);padding:6px 6px 6px 20px;border-radius:32px}
.lock input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;letter-spacing:.18em}
.lock .rb{width:46px;height:46px;display:grid;place-items:center;border-radius:50%}
.lock p{min-height:18px;margin:0;color:var(--dim);font-size:13.5px}
.shake{animation:shake .5s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* v5: мягче белый, читаемый текст на кнопках */
:root{--text:#ececf0;--dim:#a8a8b2}
.gl,.me .bubble,.sugg button,.row,.stats div,.btnr,input.f,textarea.f,.seg,.list>*,.newc,.prof,.pop button{--hl:rgba(255,255,255,.28);
 background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 50%,rgba(255,255,255,.04))!important;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 1.5px 2px 1px -1px var(--hl),inset -1.5px -2px 1px -1px rgba(255,255,255,.12),var(--drop,0 12px 32px -12px rgba(0,0,0,.65))!important}
.gl,.me .bubble,.sugg button{-webkit-backdrop-filter:blur(22px) saturate(1.4)!important;backdrop-filter:blur(22px) saturate(1.4)!important}
.gl::before,.me .bubble::before,.sugg button::before{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)!important}
.me .bubble{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.05))!important}
.gl.touch::before,.sugg button.touch::before{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 60%)!important}
.chip.touch,.row.touch,.btnr.touch,.list>*.touch,.prof.touch{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.05))!important}
.send.touch{filter:none}
.send,.cta,.beta,.ava,.seg button.on{background:#d6d6de!important;color:#0b0b0e!important}.send .ic{stroke:#0b0b0e}
.sw.on{background:#c8c8d1!important}
.hello h2{color:var(--text)}.aurora i:nth-child(2){opacity:.03}.aurora i:nth-child(4){opacity:.04}
button,.row,.sugg button,.pop button,.btnr,.chip,.newc,.prof{color:var(--text)}
.send,.cta,.beta,.ava,.seg button.on{color:#0b0b0e!important}

/* === фикс «Создаю…»: плейсхолдер = ширина рамки, пропорции как у будущего фото === */
.shot.wait{width:min(100%,var(--w,300px))}
.pending{width:100%;height:auto;aspect-ratio:var(--ar,3/4);display:grid;place-items:center;align-content:center;gap:16px;overflow:hidden;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
.pending::before{content:"";position:absolute;inset:0;transform:none;filter:none;opacity:1;animation:pshim 2.6s ease-in-out infinite;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);background-size:250% 100%}
@keyframes pshim{from{background-position:130% 0}to{background-position:-130% 0}}
.pring{position:relative;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:#fff;animation:pspin 1s linear infinite}
@keyframes pspin{to{transform:rotate(360deg)}}
.pending span{text-align:center;font-size:14px;letter-spacing:.2px}
.frame img{cursor:zoom-in}
.frame .fs{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px}
/* === полноэкранный просмотр === */
.toast{z-index:100}
.lb{position:fixed;inset:0;z-index:60;display:none;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
.lb.on{display:block}
.lbBg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s}
.lb.vis .lbBg{opacity:var(--bgo,.96)}.lb.drag .lbBg{transition:none}
.lb img{position:absolute;max-width:none;transform-origin:center;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.lb .lbX{position:absolute;top:calc(var(--sat) + 14px);right:14px;z-index:2;transition:opacity .3s}
.lb .lbBar{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);z-index:2;display:flex;gap:14px;justify-content:center;transition:opacity .3s,transform .4s var(--ease)}
.lb.ui-off .lbX,.lb.ui-off .lbBar{opacity:0;pointer-events:none}.lb.ui-off .lbBar{transform:translateY(12px)}
.lb:not(.vis) .lbX,.lb:not(.vis) .lbBar{opacity:0}
@media (prefers-reduced-motion:reduce){.pending::before,.pring{animation:none}}

/* === v2: полировка дизайна === */
.foot,.foot.low{color:#8e8e98!important}
/* blur только на больших поверхностях, мелкие кнопки — лёгкие (меньше нагрев и батарея) */
.rb.gl,.sugg button,.me .bubble,.newc.gl,.prof.gl,.plan.gl,.tpl button{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.055))}
#feed{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
.msg.ai .txt{line-height:1.58;letter-spacing:-.1px}
.frame{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 34px 70px -26px #000,0 0 0 1px rgba(255,255,255,.04)}
.frame img,.frame video{max-height:min(62vh,580px)}
@media(min-width:700px){.shot{max-width:480px}}
.cap{margin:10px 6px 0;font-size:12.5px;line-height:1.4;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* подсказки и роли на стартовом экране */
.hx{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;width:100%;max-width:520px}
.tpl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.tpl.roles button{height:32px;padding:0 13px;font-size:12.5px}

.hxl{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin-top:8px}

.srch{display:block;width:calc(100% - 8px);height:40px;margin:12px 4px 0;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;font-size:14.5px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .3s,background .3s}
.srch:focus{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.09)}.srch::placeholder{color:var(--faint)}

.hx{max-width:400px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tiles button{height:54px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;color:var(--text);text-align:left;animation:rise .8s var(--ease) both;transition:transform .5s var(--spring)}
.tiles button:active{transform:scale(.94)}.tiles .ic{width:20px;height:20px;color:#c9c9d2;flex:none}
@media (prefers-reduced-motion:reduce){.orb2,.orb2 i,.orbSh{animation:none}}

/* === v4: живой маскот === */
.mcB canvas{animation:mglow 3.8s ease-in-out infinite}

 var rnd=function(){return(sd=(sd*1664525+1013904223)>>>0)/4294967296},hue=Math.floor(rnd()*360),
 th=/дожд|ливень|rain/.test(p)?'rain':/снег|зим|snow/.test(p)?'snow':/космос|звезд|галакт|space/.test(p)?'space':/мор[еяю]|океан|волн|sea/.test(p)?'sea':'orb',P=[];
 for(i=0;i<(th==='orb'?60:120);i++)P.push({x:rnd(),y:rnd(),z:.3+rnd()*.7,a:rnd()*6.28});var t0=performance.now();
 var words=pr.split(' '),ls=[],l='';words.forEach(function(w){if((l+w).length>16){ls.push(l);l=''}l+=w+' '});ls.push(l);
 (function f(now){if(!cv.isConnected&&now-t0>500)return;requestAnimationFrame(f);var t=(now-t0)/1000;x.setTransform(2,0,0,2,0,0);
 var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'hsl('+hue+',55%,'+(th==='snow'?38:15)+'%)');g.addColorStop(1,'hsl('+(hue+50)%360+',60%,6%)');x.fillStyle=g;x.fillRect(0,0,W,H);
 P.forEach(function(o){var s=o.z;x.beginPath();
  if(th==='rain'){var px=o.x*W,py=((o.y+t*s*.9)%1)*H;x.strokeStyle='hsla('+hue+',80%,80%,'+(.2+s*.4)+')';x.lineWidth=1+s;x.moveTo(px,py);x.lineTo(px-3,py+20*s);x.stroke()}
  else if(th==='snow'){x.fillStyle='rgba(255,255,255,'+(.3+s*.6)+')';x.arc(((o.x+Math.sin(t+o.a)*.03)%1)*W,((o.y+t*s*.12)%1)*H,2+s*3,0,7);x.fill()}
  else if(th==='space'){var r=(o.y+t*s*.15)%1;x.fillStyle='hsla('+(hue+o.a*20)+',90%,85%,'+r+')';x.arc(W/2+(o.x-.5)*W*r*3,H/2+Math.sin(o.a)*H*r*.6,1+r*3,0,7);x.fill()}
  else if(th==='sea'){x.strokeStyle='hsla('+hue+',70%,70%,'+(.15+s*.3)+')';x.lineWidth=2;var y0=H*(.45+o.y*.5);for(var q=0;q<=W;q+=20)x.lineTo(q,y0+Math.sin(q*.02+t*s*2+o.a)*10);x.stroke()}
  else{x.fillStyle='hsla('+(hue+o.x*90)+',90%,70%,.75)';x.arc(W/2+Math.cos(o.a+t*s)*(60+o.y*100),H/2+Math.sin(o.a*1.3+t*s)*(80+o.y*130),2+s*5,0,7);x.fill()}});
 x.fillStyle='#fff';x.font='600 22px system-ui';x.textAlign='center';ls.slice(0,4).forEach(function(q,j){x.fillText(q.trim(),W/2,H-70+j*26-ls.length*10)})})(t0);return cv}
function videoCard(pr){var m=msgCard(clip(pr));return m[0]}
var _g=generate;generate=function(kind,pr,v,tk,ph){if(kind!=='video')return _g.apply(this,arguments);
 push({role:'assistant',content:'[показано видео: '+pr+']'});show(videoCard(pr));return Promise.resolve()};
/* ---------- понимание просьб голосом и текстом ---------- */
function intent(t){t=t.toLowerCase();if(t.length>160||/график|таблиц|схем|код\b|нарисуй/.test(t))return null;
 if(/(сделай|создай|сгенерируй|сними|покажи|хочу|запусти).{0,25}(видео|ролик|клип|анимаци)/.test(t))return['v',t.replace(/^.*?(видео|ролик|клип|анимаци\S*)\s*(про|о|об|на тему|с)?\s*/,'')||'Velora'];
 if(/змейк|snake/.test(t))return['g','snake'];if(/крестик|нолик/.test(t))return['g','ttt'];if(/звёзд|звезд|лови/.test(t)&&/игр|поигра|сыгра/.test(t))return['g','catch'];
 if(/(игр[ауы]|поигра|сыгра)/.test(t)&&/(сделай|создай|запусти|давай|хочу|покажи|во что)/.test(t)){var a=['snake','ttt','catch'];return['g',a[Math.floor(Math.random()*3)]]}return null}
var _s=submit;submit=function(text){var t=(text==null?inp.value:text).trim();
 if(t&&!S.busy&&!S.img&&!(window.A&&A.files.length)){var k=intent(t);if(k){inp.value='';fit();haptic('medium');
  if(k[0]==='g'){var g=GAMES[k[1]];reply(t,g[2],gameCard(k[1]));setTimeout(function(){play(k[1])},vm.on?2600:500)}
  else{reply(t,'Снимаю короткое видео: «'+k[1]+'».',videoCard(k[1]))}return}}
 return _s.apply(this,arguments)};
})();
